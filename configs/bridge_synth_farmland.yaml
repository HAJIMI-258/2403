seed: 42

dataset:
  name: bridge_synth_farmland_v1
  resolution: [320, 320]
  sequence_length: 480
  num_sequences: 6
  num_objects_range: [2, 4]
  shapes: [circle, square, triangle]
  object_scale_range: [14, 46]
  velocity_range: [0.7, 3.4]
  spawn_margin: 20
  occlusion_probability: 0.80
  reentry_probability: 0.75
  background_drift:
    enabled: true
    brightness_amplitude: 0.20
    texture_noise_std: 0.06
  appearance_perturbation:
    enabled: true
    scale_jitter: 0.20
    intensity_jitter: 0.14
    edge_blur_probability: 0.30
  outputs:
    - frame
    - boxes
    - masks
    - instance_id
    - concept_id

bridge:
  domain: farmland
  background_patterns:
    - leaf_texture
    - soil_texture
    - branch_noise
    - weed_repetition
  illumination_events:
    - global_brightness_drift
    - local_shadow
    - backlight_shift
    - gamma_perturbation
  disturbance_events:
    - dust_noise
    - motion_blur
    - sensor_noise
    - non_rigid_motion
  target_styles:
    - irregular_outline
    - edge_damage
    - pose_variation
    - multiscale_regions
  evaluation_focus:
    - objectness_under_complex_natural_background
    - id_stability_under_shadow_and_drift
    - normal_abnormal_prototype_pollution

model:
  spike_encoder:
    edge_weight: 0.50
    on_off_threshold: 0.10
  objectness:
    alpha_boundary: 1.00
    beta_temporal: 0.60
    gamma_surprise: 0.40
    delta_residual: 0.55
    temporal_decay: 0.82
    surprise_decay: 0.90
    habituation_decay: 0.94
    habituation_lambda: 0.85
    smoothing_kernel_size: 5
    proposal_threshold: 0.45
    min_area: 96
    max_proposals: 8

tracking:
  iou_threshold: 0.30
  max_center_distance: 48.0
  iou_weight: 0.55
  center_weight: 0.25
  signature_weight: 0.20
  max_missed_frames: 12
  signature_momentum: 0.70
  velocity_momentum: 0.65
  use_motion_prediction: true
  prediction_steps_cap: 3
  reid_similarity_threshold: 0.92

memory:
  birth_threshold: 0.95
  merge_threshold: 0.99
  decay_rate: 0.02
  budget_cap: 32
  prototype_momentum: 0.75
  decay_floor: 0.10
  inactive_patience: 20

