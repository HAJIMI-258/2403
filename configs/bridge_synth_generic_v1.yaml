seed: 42

dataset:
  name: bridge_synth_generic_v1
  resolution: [320, 320]
  sequence_length: 960
  num_sequences: 4
  num_objects_range: [2, 5]
  shapes: [circle, square, triangle]
  object_scale_range: [12, 42]
  velocity_range: [0.8, 3.6]
  spawn_margin: 20
  occlusion_probability: 0.85
  reentry_probability: 0.85
  background_drift:
    enabled: true
    brightness_amplitude: 0.16
    texture_noise_std: 0.05
  appearance_perturbation:
    enabled: true
    scale_jitter: 0.18
    intensity_jitter: 0.12
    edge_blur_probability: 0.22
  bridge_synthetic:
    enabled: true
    difficulty_preset: bridge_generic_v1
    background_repeat_density: 0.55
    background_texture_strength: 0.28
    illumination_drift_strength: 0.20
    local_noise_std: 0.020
    local_blur_probability: 0.18
    camera_jitter_std: 1.35
    occlusion_duration_range: [28, 96]
    reentry_gap_range: [20, 100]
    crossing_probability: 0.65
    target_deformation_strength: 0.18
    low_contrast_probability: 0.25
  outputs:
    - frame
    - boxes
    - masks
    - instance_id
    - concept_id
    - visibility_flag
    - occlusion_ratio
    - drift_strength
    - blur_level
    - noise_level
    - reentry_event

model:
  spike_encoder:
    edge_weight: 0.50
    on_off_threshold: 0.10

field:
  wb: 0.35
  wt: 0.20
  wq: 0.25
  wr: 0.20
  tau_obj: 0.47
  ema_eta: 0.82
  hab_rho: 0.90
  hab_lambda: 0.95
  threshold_mode: quantile_local
  q_obj: 0.92
  local_k: 0.95
  smoothing_kernel_size: 5
  min_area: 96
  max_proposals: 8

tracking:
  beta_iou: 0.35
  beta_center: 0.45
  beta_feat: 0.20
  max_match_cost: 0.62
  min_match_similarity: 0.12
  missed_match_similarity_boost: 0.05
  use_gap_aware_matching: true
  keepalive_frames: 8
  use_linear_prediction: true
  use_dormant_reactivation: true
  dormant_frames: 16
  ghost_frames: 80
  tau_g: 12
  tau_res_short: 0.56
  tau_res_long: 0.68
  tau_continuation: 0.62
  continuation_margin: 0.08
  tau_react_short: 0.62
  tau_react_long: 0.78
  tau_proto_attach: 0.40
  tau_obj_attach: 0.40
  reactivation_cost: 0.84
  reactivation_proto_sim: 0.32
  signature_momentum: 0.70
  velocity_momentum: 0.65
  enable_identity_slots: false
  slot_topk_per_proto: 4
  min_track_age_for_slot: 4
  min_hits_for_slot: 3
  slot_max_gap: 96
  slot_tau: 0.62
  slot_margin: 0.08
  slot_decay: 0.01

memory:
  tau_birth: 0.35
  tau_merge: 0.18
  tau_sim: 0.20
  lr_proto: 0.35
  decay_rate: 0.03
  decay_patience: 24
  memory_budget: 32
  decay_floor: 0.10
  tau_proto_attach: 0.40
  tau_obj_attach: 0.40
  use_concept_only_recovery: true
  protect_linked_prototypes: true
  enable_continuation_bank: true
  continuation_topk_per_proto: 4
  min_track_age_for_continuation: 4
  min_hits_for_continuation: 3
  continuation_max_gap: 96
  continuation_decay: 0.01
  anchor_ttl: 192
  anchor_expiry_policy: ttl
  anchor_prune_policy: topk_priority
  anchor_survives_retire: true
  anchor_survives_head_replace: true
  recovery_anchor_topk_per_lineage: 4

lineage:
  enable_explicit_lineage: true
  preserve_lineage_on_archive: true
  preserve_lineage_on_replace: true
  preserve_lineage_on_merge: true
  allow_alias_lineage: true

prototype_continuation:
  bind_continuation_to: lineage
  continuation_topk_per_lineage: 4
  min_track_age_for_continuation: 4
  min_hits_for_continuation: 3
  continuation_max_gap: 96
  tau_continuation: 0.62
  continuation_margin: 0.08
  continuation_decay: 0.01

evaluation:
  match_iou_threshold: 0.50
  reentry_window: 16
  primary_metrics:
    - u_recall
    - pfr
    - idsw
    - churn
    - memory_growth
  secondary_metrics:
    - purity

lineage_audit:
  enable_lineage_audit: true
  dump_event_trace: true
  dump_continuation_lifecycle: true
  use_lineage_aware_eval: true

logging:
  save_frame_stride: 25
  save_artifacts: true
  output_root: results
