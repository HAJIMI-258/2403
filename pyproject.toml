[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nops-owr"
version = "0.1.0"
description = "Phase 1 minimal closure for NOPS-OWR."
readme = "docs/problem_definition_v1.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "torch>=2.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["nops_owr*", "datasets*", "metrics*", "baselines*"]

