seed: 42
dataset:
  name: synth_stream_v1
  resolution:
  - 256
  - 256
  sequence_length: 500
  num_sequences: 8
  num_objects_range:
  - 1
  - 3
  shapes:
  - circle
  - square
  - triangle
  object_scale_range:
  - 18
  - 42
  velocity_range:
  - 1.0
  - 4.0
  spawn_margin: 24
  occlusion_probability: 0.25
  reentry_probability: 0.2
  background_drift:
    enabled: true
    brightness_amplitude: 0.12
    texture_noise_std: 0.03
  appearance_perturbation:
    enabled: true
    scale_jitter: 0.1
    intensity_jitter: 0.08
    edge_blur_probability: 0.15
  outputs:
  - frame
  - boxes
  - masks
  - instance_id
  - concept_id
model:
  spike_encoder:
    edge_weight: 0.5
    on_off_threshold: 0.1
field:
  wb: 0.35
  wt: 0.2
  wq: 0.25
  wr: 0.2
  tau_obj: 0.47
  ema_eta: 0.82
  hab_rho: 0.9
  hab_lambda: 0.95
  smoothing_kernel_size: 5
  min_area: 96
  max_proposals: 8
tracking:
  beta_iou: 0.35
  beta_center: 0.45
  beta_feat: 0.2
  max_match_cost: 0.62
  keepalive_frames: 8
  use_linear_prediction: true
  signature_momentum: 0.7
  velocity_momentum: 0.65
memory:
  tau_birth: 0.35
  tau_merge: 0.18
  tau_sim: 0.2
  lr_proto: 0.35
  decay_rate: 0.02
  decay_patience: 20
  memory_budget: 32
  decay_floor: 0.1
evaluation:
  match_iou_threshold: 0.5
  primary_metrics:
  - u_recall
  - pfr
  - idsw
  - churn
  - memory_growth
  secondary_metrics:
  - purity
logging:
  save_frame_stride: 25
  save_artifacts: true
  output_root: results
